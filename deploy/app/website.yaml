# yoalto.com — Astro built to static HTML, served by nginx.
#
# Stateless: no database, no secrets, nothing to migrate. It is a file server, which is why
# it runs with a read-only root filesystem and no credentials of any kind, and why two
# replicas are free.
---
apiVersion: v1
kind: Namespace
metadata:
  name: yoalto-website
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: yoalto-website
  labels: { app.kubernetes.io/name: website }
spec:
  replicas: 2
  strategy:
    # RollingUpdate: nothing here holds state, so two versions may serve side by side for a
    # moment and a deploy causes no downtime.
    type: RollingUpdate
  selector:
    matchLabels: { app.kubernetes.io/name: website }
  template:
    metadata:
      labels: { app.kubernetes.io/name: website }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        # 101 is the uid baked into nginx-unprivileged, and the image's files are owned by
        # it. Numeric because kubelet cannot verify that a NAME is non-root and would refuse
        # the container outright.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: website
          # Pin a real tag from `make image-push` before applying this.
          image: ghcr.io/yoalto-rnd/website:REPLACE_ME
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          # nginx needs somewhere to write even when only serving files: its pid file and
          # temp buffers. nginx.conf points all of them at /tmp, so one emptyDir keeps the
          # root filesystem read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: yoalto-website
spec:
  selector: { app.kubernetes.io/name: website }
  ports:
    - name: http
      port: 8080
      targetPort: http
