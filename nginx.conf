# Static serving for the Yoalto website.
#
# nginx rather than a hand-written server: a file server is a category with a long history
# of path-traversal and header bugs, and this one has had twenty years of people attacking
# it. The behaviours below are the only things we need it to decide.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout combined;
  sendfile      on;
  server_tokens off;          # do not advertise the version to anyone probing

  # Every writable path moved under /tmp, so the container can run with a read-only root
  # filesystem.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  server {
    listen 8080;
    root /site;
    index index.html;
    autoindex off;            # never list a directory

    location = /healthz {
      access_log off;
      add_header Content-Type application/json;
      return 200 '{"status":"ok"}';
    }

    # Build outputs carry a content hash in the filename, so they can be cached forever —
    # a change produces a new name. Astro emits these under /_astro/.
    location /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # HTML must always revalidate, or a deploy strands people on the old page indefinitely.
    location / {
      add_header Cache-Control "public, max-age=0, must-revalidate";
      # =404, NOT /index.html. A typo must 404 rather than silently rendering the home
      # page, which would make a wrong URL look like a working one.
      try_files $uri $uri/index.html =404;
    }
  }
}
